name: Refresh profile art

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  stats:
    name: Live stats card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - name: Rebuild SVGs with live GitHub numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --live

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile art" && git push)

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#2EC4B6&color_dots=#161936,#3B2A55,#7A3B63,#D4574F,#FF9933
            dist/snake-light.svg?color_snake=#0F766E&color_dots=#EBEDF0,#FFD9B0,#FFB36B,#FF8A3D,#E8590C

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
