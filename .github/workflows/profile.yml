name: Refresh profile art

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  stats:
    name: Rebuild stats + contribution graph
    # Runs on your own machine while GitHub-hosted runners are locked by billing.
    # Once billing is fixed you can switch this to ubuntu-latest; nothing else needs to change.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: python -m pip install -r scripts/requirements.txt

      - name: Rebuild SVGs with live GitHub numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --live

      # Written in Python so it behaves the same under Windows PowerShell, bash and zsh.
      - name: Commit if anything changed
        shell: python
        run: |
          import subprocess

          def git(*args):
              subprocess.run(["git", *args], check=True)

          git("config", "user.name", "github-actions[bot]")
          git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          git("add", "assets")

          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              print("Nothing changed, no commit needed.")
          else:
              git("commit", "-m", "chore: refresh profile art")
              git("push")
